{% load static %}
<!-- Fondo oscuro al abrir menú en celular -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<aside class="sidebar-galeno" id="sidebarGaleno">
    <!-- Cabecera del Sidebar -->
    <div class="sidebar-brand">
        <img src="{% static 'image/logo.jpeg' %}" alt="Logo Galeno" class="sidebar-logo">
        <div class="sidebar-title-group">
            <span class="sidebar-brand-title">Academia Galeno</span>
            <span class="sidebar-brand-sub">{% if es_docente %}Portal Docente{% else %}Portal Estudiantil{% endif %}</span>
        </div>
        <!-- Botón para cerrar en celular -->
        <button type="button" class="sidebar-close-btn" id="btnSidebarClose">✕</button>
    </div>

    <!-- Menú de enlaces verticales -->
    <nav class="sidebar-menu">
        <a href="{% if es_docente %}{% url 'docente_dashboard' %}{% else %}{% url 'dashboard' %}{% endif %}" 
           class="sidebar-link {% if seccion_activa == 'inicio' %}active{% endif %}">
            <span>🏠</span> Inicio / Intranet
        </a>
        <a href="{% if es_docente %}{% url 'docente_mis_cursos' %}{% else %}{% url 'mis_cursos' %}{% endif %}" 
           class="sidebar-link {% if seccion_activa == 'cursos' %}active{% endif %}">
            <span>📚</span> Aula Virtual (Mis Cursos)
        </a>
        {% if es_docente %}
        <a href="{% url 'docente_mis_asistencias' %}" 
           class="sidebar-link {% if seccion_activa == 'asistencias' %}active{% endif %}">
            <span>⏱️</span> Asistencias
        </a>
        {% endif %}
        <a href="{% url 'mi_perfil' %}" 
           class="sidebar-link {% if seccion_activa == 'perfil' %}active{% endif %}">
            <span>👤</span> Mi Perfil
        </a>
    </nav>

    <!-- Logout -->
    <a href="{% url 'logout' %}" class="sidebar-logout">
        <span>🚪</span> Cerrar Sesión
    </a>
</aside>
