{% load static %}
<!-- Barra Lateral Modular de Intranet -->
<aside class="sidebar-student">
    <!-- Logo Institucional -->
    <div class="sidebar-brand">
        <img src="{% static 'image/logo.jpeg' %}" alt="Logo Academia Galeno" class="sidebar-logo-img">
        <div class="sidebar-brand-text">
            <span class="sidebar-brand-title">Academia Galeno</span>
            <span class="sidebar-brand-subtitle">PORTAL ESTUDIANTIL</span>
        </div>
    </div>

    <!-- Menú de Enlaces de la Intranet -->
    <nav class="sidebar-menu">
        <a href="{% url 'dashboard' %}" class="sidebar-item {% if seccion_activa == 'intranet' %}active{% endif %}">
            <span class="sidebar-icon">🏠</span> Inicio / Intranet
        </a>
        <a href="{% url 'mis_cursos' %}" class="sidebar-item {% if seccion_activa == 'aula' %}active{% endif %}">
            <span class="sidebar-icon">🎓</span> Aula Virtual
        </a>
        <a href="{% url 'mis_notas' %}" class="sidebar-item {% if seccion_activa == 'notas' %}active{% endif %}">
            <span class="sidebar-icon">📊</span> Consulta de Notas
        </a>
        <a href="#" class="sidebar-item {% if seccion_activa == 'asistencia' %}active{% endif %}">
            <span class="sidebar-icon">⏱️</span> Mi Asistencia a Clases
        </a>
        <a href="{% url 'mi_perfil' %}" class="sidebar-item {% if seccion_activa == 'perfil' %}active{% endif %}">
            <span class="sidebar-icon">👤</span> Mi Perfil
        </a>
    </nav>

    <!-- Botón Cerrar Sesión Inferior -->
    <div class="sidebar-footer">
        <a href="{% url 'salir' %}" class="sidebar-item logout-link">
            <span class="sidebar-icon">🚪</span> Cerrar Sesión
        </a>
    </div>
</aside>
