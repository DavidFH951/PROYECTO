<aside class="sidebar-curso-nav">
    <div class="sidebar-curso-section-title">Navegación</div>
    <a href="#seccion-general" class="sidebar-curso-link btn-general-active">
        <span>🏠 General y Avisos</span>
    </a>

    <div class="sidebar-curso-section-title">Semanas del Ciclo</div>
    {% for bloque in bloques_semanas %}
    <a href="#semana-{{ bloque.info.numero }}" class="sidebar-curso-link">
        <span class="sidebar-link-label">
            <span class="sidebar-emoji">📅</span> Semana {{ bloque.info.numero }}
        </span>

        {% if bloque.total_recursos > 0 %}
            <span class="sidebar-badge-counter">{{ bloque.total_recursos }}</span>
        {% else %}
            <span class="sidebar-badge-empty">0</span>
        {% endif %}
    </a>
    {% empty %}
    <div style="padding: 10px 14px; font-size: 12px; color: #64748b;">
        Sin semanas registradas
    </div>
    {% endfor %}
</aside>
