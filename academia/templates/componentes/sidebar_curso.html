{% load static %}
<!-- Fondo oscuro para celular al abrir el menú de semanas -->
<div class="sidebar-backdrop" id="sidebarCursoBackdrop"></div>

<aside class="sidebar-curso-dark" id="sidebarCurso">
    <!-- Cabecera en móvil con botón X -->
    <div class="sidebar-curso-mobile-header">
        <span class="sidebar-curso-mobile-title">Semanas del Ciclo</span>
        <button type="button" class="sidebar-close-btn" id="btnSidebarCursoClose">✕</button>
    </div>

    <!-- Contenido existente de navegación y semanas -->
    <div class="sidebar-curso-scroll">
        <div class="seccion-bloque">
            <span class="bloque-label">NAVEGACIÓN</span>
            <a href="{% url 'detalle_curso_token' token=token curso_id=curso.id %}" class="btn-semana-item active">
                <span>🏠</span> General y Avisos
            </a>
        </div>

        <div class="seccion-bloque">
            <span class="bloque-label">SEMANAS DEL CICLO</span>
            <div class="lista-semanas">
                {% for sem in semanas %}
                <a href="?semana={{ sem.numero }}" class="btn-semana-item {% if semana_activa == sem.numero %}selected{% endif %}">
                    <span>📅</span> {{ sem.etiqueta|default:sem.nombre }}
                    <span class="badge-count">{{ sem.total_materiales|default:"0" }}</span>
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
</aside>
