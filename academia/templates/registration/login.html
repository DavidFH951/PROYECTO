{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso al Sistema - Academia de Medicina</title>
    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <div class="icon">
                <img src="{% static 'image/logo.jpeg' %}" alt="Logo Academia Médica" style="max-width: 85px; height: auto; border-radius: 8px; margin-bottom: 10px;">
            </div>
            <h2>Academia Galeno</h2>
            <p>Ingresa tus credenciales institucionales</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            {{ form.non_field_errors }}

            <div class="form-group">
                <label>Usuario</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>
    </div>

</body>
</html>
