{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Academia Galeno</title>
    <link rel="icon" type="image/jpeg" href="{% static 'image/logo.jpeg' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=3.1">
    <link rel="stylesheet" href="{% static 'css/intranet.css' %}?v=1.4">
    <link rel="stylesheet" href="{% static 'css/perfil.css' %}">
</head>
<body class="intranet-body">

    <div class="intranet-layout">
        
        <!-- Sidebar Modular -->
        {% include 'componentes/sidebar_intranet.html' with seccion_activa='perfil' es_docente=es_docente %}

        <div class="intranet-main">
            
            <!-- Topbar Modular estándar -->
            {% include 'componentes/topbar_intranet.html' with es_docente=es_docente %}

            <div style="padding: 14px 32px 0 32px;">
                {% include 'componentes/mensajes.html' %}
            </div>

            <main class="intranet-content" style="padding-top: 20px;">
                <!-- Aquí colocas la tarjeta azul con la información del usuario y el botón 2FA -->
                <div class="perfil-card-container">
                    <!-- Tu contenido actual de la tarjeta de perfil -->
                </div>
            </main>

        </div>

    </div>

    <script src="{% static 'js/intranet.js' %}?v=1.0" defer></script>
</body>
</html>
